<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AI Resume Pro
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<nav class="navbar">

    <a
        href="{{ url_for('home') }}"
        class="logo"
    >
        AI Resume Pro
    </a>


    <div class="nav-links">

        <a
            href="{{ url_for('home') }}"
        >
            Home
        </a>

        <a
            href="{{ url_for('analyzer') }}"
        >
            Analyzer
        </a>

        <a
            href="{{ url_for('optimizer') }}"
        >
            Optimizer
        </a>

    </div>

</nav>



{% with messages = get_flashed_messages() %}

    {% if messages %}

        <div class="flash-container">

            {% for message in messages %}

                <div class="flash-message">
                    {{ message }}
                </div>

            {% endfor %}

        </div>

    {% endif %}

{% endwith %}



<main>

    {% block content %}

    {% endblock %}

</main>



<footer>

    <p>
        AI Resume Pro |
        Resume Analysis and Optimization Platform
    </p>

</footer>


</body>

</html>
