{% extends "base.html" %}


{% block content %}


<section class="page-header">

    <p>
        AI RESUME ANALYZER
    </p>

    <h1>
        Analyze Your Resume
    </h1>

    <span>
        Upload your resume and paste the job description
        to check your match score and skills.
    </span>

</section>



<div class="form-container">

    <form
        method="POST"
        enctype="multipart/form-data"
    >


        <div class="form-group">

            <label>
                Upload Resume
            </label>

            <input
                type="file"
                name="resume"
                accept=".pdf"
                required
            >

            <small>
                Only PDF files are supported.
            </small>

        </div>



        <div class="form-group">

            <label>
                Job Description
            </label>

            <textarea
                name="job_description"
                placeholder="Paste the complete job description here..."
                required
            ></textarea>

        </div>



        <button
            type="submit"
            class="primary-btn full-btn"
        >
            Analyze Resume
        </button>


    </form>

</div>


{% endblock %}
